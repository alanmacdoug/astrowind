site:
  name: MacDougall Systems
  site: 'https://astrowind.main-0dc.workers.dev'
  base: '/'
  trailingSlash: false

# Default SEO metadata
metadata:
  title:
    default: MacDougall Systems — Email Infrastructure & Deliverability
    template: '%s — MacDougall Systems'
  description: 'Email infrastructure and deliverability consultancy. SPF, DKIM and DMARC audits, managed email systems, and fix-it services that keep your email out of spam.'
  robots:
    index: true
    follow: true
  openGraph:
    site_name: MacDougall Systems
    images:
      - url: '~/assets/images/default.png'
        width: 1200
        height: 628
    type: website
  twitter:
    handle: null
    site: null
    cardType: summary_large_image

i18n:
  language: en
  textDirection: ltr

apps:
  blog:
    isEnabled: true
    postsPerPage: 8

    post:
      isEnabled: true
      permalink: '/%slug%' # Variables: %slug%, %year%, %month%, %day%, %hour%, %minute%, %second%, %category%
      robots:
        index: true

    list:
      isEnabled: true
      pathname: 'blog' # Blog main path, you can change this to "articles" (/articles)
      robots:
        index: true

    category:
      isEnabled: true
      pathname: 'category' # Category main path /category/some-category, you can change this to "group" (/group/some-category)
      robots:
        index: true

    tag:
      isEnabled: true
      pathname: 'tag' # Tag main path /tag/some-tag, you can change this to "topics" (/topics/some-category)
      robots:
        index: false

    isRelatedPostsEnabled: true
    relatedPostsCount: 4

analytics:
  vendors:
    googleAnalytics:
      id: null

ui:
  theme: 'system' # Values: "system" | "light" | "dark" | "light:only" | "dark:only"
